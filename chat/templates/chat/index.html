<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ifra's CHATBOT🤖</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #090d16;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .layout {
            display: flex;
            width: 95vw;
            height: 90vh;
            max-width: 1250px;
            background: #0f172a;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.15);
            border: 1px solid #1e293b;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #0b1329;
            border-right: 1px solid #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            transition: all 0.2s ease;
        }

        .new-chat:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        .history-title {
            font-size: 11px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        #conversation-list {
            overflow-y: auto;
            flex: 1;
        }

        .conversation-item {
            display: block;
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 6px;
            border-radius: 10px;
            background: transparent;
            color: #cbd5e1;
            text-align: left;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: #1e293b;
            color: #38bdf8;
        }

        /* Main Chat Window */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #0f172a;
        }

        header {
            padding: 18px 24px;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .bot-avatar {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
            50% { box-shadow: 0 0 22px rgba(56, 189, 248, 0.8); }
        }

        header h2 {
            margin: 0 0 3px;
            font-size: 18px;
            color: #f8fafc;
        }

        header p {
            margin: 0;
            font-size: 13px;
            color: #94a3b8;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            margin-bottom: 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 15px;
        }

        .bot {
            background: #1e293b;
            color: #f1f5f9;
            margin-right: auto;
            border-bottom-left-radius: 4px;
            border: 1px solid #334155;
        }

        .user {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        /* Welcome & Suggestion Chips */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

        .welcome-avatar {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 16px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
        }

        .suggestions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .suggestion-chip {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            background: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }

        /* Form / Input */
        form {
            display: flex;
            gap: 12px;
            padding: 18px 24px;
            background: #0b1329;
            border-top: 1px solid #1e293b;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px 18px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
        }

        button[type="submit"] {
            padding: 0 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* AI Typing Animation */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            width: fit-content;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            margin: 10px 0;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: #38bdf8;
            border-radius: 50%;
            animation: typing 1.2s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        @media (max-width: 768px) {
            .layout {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            .sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <button class="new-chat" id="new-chat">+ New Chat</button>
        <div class="history-title">CHAT HISTORY</div>
        <div id="conversation-list"></div>
    </aside>

    <main class="main">
        <header>
            <div class="bot-avatar">🤖</div>
            <div class="header-info">
                <h2>IFRA AI CHATBOT🤖</h2>
                <p>Your interactive learning companion</p>
            </div>
        </header>

        <section id="messages" aria-live="polite">
            <div class="welcome-container">
                <div class="welcome-avatar">🤖</div>
                <h3 style="color: #f8fafc; margin-bottom: 8px;">Welcome to  AI CHATBOT🤖</h3>
                <p style="color: #94a3b8; font-size: 14px; max-width: 400px; margin-bottom: 20px;">
                    Ask me anything or click a suggestion below to get started instantly!
                </p>
                
            </div>
        </section>

        <form id="chat-form">
            <input
                id="user-input"
                type="text"
                placeholder="Ask me anything..."
                autocomplete="off"
                required
            >
            <button type="submit">Send</button>
        </form>
    </main>

</div>

<script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const messages = document.getElementById("messages");
    const conversationList = document.getElementById("conversation-list");
    const newChatButton = document.getElementById("new-chat");

    let currentConversationId = null;
    let isSending = false;

    function addMessage(text, sender) {
        const welcome = messages.querySelector(".welcome-container");
        if (welcome) {
            messages.innerHTML = "";
        }

        const message = document.createElement("div");
        message.className = `message ${sender}`;
        message.textContent = text;
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
        return message;
    }

    function showTypingIndicator(message) {
        message.innerHTML = `
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;
    }

    function showWelcome() {
        messages.innerHTML = `
            <div class="welcome-container">
                <div class="welcome-avatar">🤖</div>
                <h3 style="color: #f8fafc; margin-bottom: 8px;">Welcome to CyberBot AI</h3>
                <p style="color: #94a3b8; font-size: 14px; max-width: 400px; margin-bottom: 20px;">
                    Ask me anything or click a suggestion below to get started instantly!
                </p>
                <div class="suggestions">
                    <div class="suggestion-chip" onclick="sendSuggestion('Explain Python OOPs concepts')">🐍 Explain Python OOPs</div>
                    <div class="suggestion-chip" onclick="sendSuggestion('How to create models in Django?')">🌐 Django Models</div>
                    <div class="suggestion-chip" onclick="sendSuggestion('Give me Python coding interview questions')">💻 Python Interview Questions</div>
                </div>
            </div>
        `;
    }

    window.sendSuggestion = function(text) {
        input.value = text;
        form.requestSubmit();
    };

    async function loadConversations() {
        try {
            const response = await fetch("/conversations/");
            if (!response.ok) throw new Error("Could not load history");
            const conversations = await response.json();
            conversationList.innerHTML = "";

            conversations.forEach(conversation => {
                const item = document.createElement("div");
                item.style.display = "flex";
                item.style.alignItems = "center";
                item.style.gap = "5px";
                item.style.marginBottom = "7px";

                const chatButton = document.createElement("button");
                chatButton.className = "conversation-item";
                chatButton.textContent = conversation.title;
                chatButton.title = conversation.title;
                chatButton.style.flex = "1";
                chatButton.style.marginBottom = "0";

                if (conversation.id === currentConversationId) {
                    chatButton.classList.add("active");
                }

                chatButton.addEventListener("click", () => {
                    openConversation(conversation.id);
                });

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "🗑️";
                deleteButton.title = "Delete conversation";
                deleteButton.style.padding = "8px";
                deleteButton.style.background = "transparent";
                deleteButton.style.color = "#94a3b8";
                deleteButton.style.border = "none";
                deleteButton.style.cursor = "pointer";

                deleteButton.addEventListener("click", async (e) => {
                    e.stopPropagation();
                    const confirmed = confirm("Are you sure you want to delete this conversation?");
                    if (!confirmed) return;

                    try {
                        const csrfToken = document.cookie
                            .split("; ")
                            .find(row => row.startsWith("csrftoken="))
                            ?.split("=")[1];

                        const deleteResponse = await fetch(`/conversations/${conversation.id}/delete/`, {
                            method: "POST",
                            headers: { "X-CSRFToken": csrfToken || "" }
                        });

                        const result = await deleteResponse.json();
                        if (!deleteResponse.ok) throw new Error(result.error || "Delete failed");

                        if (currentConversationId === conversation.id) {
                            currentConversationId = null;
                            showWelcome();
                        }

                        await loadConversations();
                    } catch (error) {
                        console.error(error);
                        alert("Unable to delete conversation.");
                    }
                });

                item.appendChild(chatButton);
                item.appendChild(deleteButton);
                conversationList.appendChild(item);
            });
        } catch (error) {
            console.error("History error:", error);
        }
    }

    async function openConversation(id) {
        if (isSending) return;

        try {
            const response = await fetch(`/conversations/${id}/`);
            if (!response.ok) throw new Error("Could not open conversation");

            const data = await response.json();
            currentConversationId = id;
            messages.innerHTML = "";

            data.forEach(message => {
                addMessage(message.content, message.role === "user" ? "user" : "bot");
            });

            await loadConversations();
        } catch (error) {
            console.error(error);
            alert("Unable to open this conversation.");
        }
    }

    newChatButton.addEventListener("click", function () {
        if (isSending) return;
        currentConversationId = null;
        showWelcome();
        loadConversations();
        input.focus();
    });

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (isSending) return;

        const text = input.value.trim();
        if (!text) return;

        isSending = true;
        addMessage(text, "user");

        input.value = "";
        input.disabled = true;
        newChatButton.disabled = true;

        const sendButton = form.querySelector("button");
        sendButton.disabled = true;

        const botMessage = addMessage("", "bot");
        showTypingIndicator(botMessage);

        try {
            const csrfToken = document.cookie
                .split("; ")
                .find(row => row.startsWith("csrftoken="))
                ?.split("=")[1];

            const formData = new URLSearchParams();
            formData.append("message", text);

            if (currentConversationId !== null) {
                formData.append("conversation_id", currentConversationId);
            }

            const response = await fetch("/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": csrfToken || ""
                },
                body: formData.toString()
            });

            if (!response.ok) {
                const data = await response.json();
                botMessage.textContent = data.error || "Something went wrong.";
                return;
            }

            const newId = response.headers.get("X-Conversation-ID");
            if (newId) {
                currentConversationId = Number(newId);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let firstChunk = true;

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                if (firstChunk) {
                    botMessage.innerHTML = "";
                    firstChunk = false;
                }

                botMessage.textContent += decoder.decode(value, { stream: true });
                messages.scrollTop = messages.scrollHeight;
            }

            botMessage.textContent += decoder.decode();

            if (firstChunk) {
                botMessage.innerHTML = "";
            }

            if (!botMessage.textContent.trim()) {
                botMessage.textContent = "No response received.";
            }

            await loadConversations();
        } catch (error) {
            console.error(error);
            botMessage.textContent = "Unable to connect to the server. Please try again.";
        } finally {
            isSending = false;
            input.disabled = false;
            sendButton.disabled = false;
            newChatButton.disabled = false;
            input.focus();
        }
    });

    loadConversations();
</script>

</body>
</html>
